name: Deploy

# Migrate, then deploy, then smoke-test one environment (docs/DECISIONS.md
# P10-1). Called by CI for staging and by Release for production. The repository
# (not GitHub environments, which a free plan's private repositories lack) holds
# SUPABASE_ACCESS_TOKEN, VERCEL_TOKEN and VERCEL_ORG_ID, and per target
# <TARGET>_SUPABASE_PROJECT_REF, <TARGET>_SUPABASE_DB_PASSWORD and
# <TARGET>_VERCEL_PROJECT_ID as secrets, <TARGET>_APP_URL as a variable.

on:
  workflow_call:
    inputs:
      target:
        description: STAGING or PRODUCTION (the prefix of its secrets and variable)
        required: true
        type: string
      ref:
        description: Commit to deploy (defaults to the calling run's commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never two deploys of one target at once, and never cancel one halfway.
    concurrency:
      group: deploy-${{ inputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets[format('{0}_SUPABASE_PROJECT_REF', inputs.target)] }}
      SUPABASE_DB_PASSWORD: ${{ secrets[format('{0}_SUPABASE_DB_PASSWORD', inputs.target)] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[format('{0}_VERCEL_PROJECT_ID', inputs.target)] }}
      APP_URL: ${{ vars[format('{0}_APP_URL', inputs.target)] }}
    steps:
      - name: Check the target is set up
        run: |
          case "$TARGET" in STAGING|PRODUCTION) ;; *) echo "::error::Unknown target $TARGET"; exit 1 ;; esac
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD \
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID APP_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set for $TARGET"; exit 1; fi
          done

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations go first: they must keep the running app working
      # (docs/RUNBOOK.md). The seed never leaves local and CI databases.
      - name: Apply database migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --yes

      # The commit is built into the app (/api/health reports it), so the smoke
      # tests can tell the new deployment is the one answering.
      - name: Build and deploy on Vercel
        run: |
          export NEXT_PUBLIC_BUILD_SHA="$(git rev-parse HEAD)"
          pnpm dlx vercel@60.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@60.1.3 build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@60.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke-test the live site
        run: EXPECTED_VERSION="$(git rev-parse HEAD)" pnpm smoke
        env:
          CI: true
          SMOKE_URL: ${{ env.APP_URL }}
