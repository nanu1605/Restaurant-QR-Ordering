name: Deploy

# Migrate, then deploy, then smoke-test one environment (docs/DECISIONS.md
# P10-1). Called by CI for staging and by Release for production. The repository
# (not GitHub environments, which a free plan's private repositories lack) holds
# VERCEL_TOKEN and VERCEL_ORG_ID, and per target <TARGET>_SUPABASE_ACCESS_TOKEN
# (scoped to that target's project), <TARGET>_SUPABASE_PROJECT_REF,
# <TARGET>_SUPABASE_DB_PASSWORD and <TARGET>_VERCEL_PROJECT_ID as secrets,
# <TARGET>_APP_URL as a variable, and SENTRY_AUTH_TOKEN for source maps.

on:
  workflow_call:
    inputs:
      target:
        description: STAGING or PRODUCTION (the prefix of its secrets and variable)
        required: true
        type: string
      ref:
        description: Commit to deploy (defaults to the calling run's commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and deploy ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Never two deploys of one target at once, and never cancel one halfway.
    concurrency:
      group: deploy-${{ inputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets[format('{0}_SUPABASE_ACCESS_TOKEN', inputs.target)] }}
      SUPABASE_PROJECT_REF: ${{ secrets[format('{0}_SUPABASE_PROJECT_REF', inputs.target)] }}
      SUPABASE_DB_PASSWORD: ${{ secrets[format('{0}_SUPABASE_DB_PASSWORD', inputs.target)] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[format('{0}_VERCEL_PROJECT_ID', inputs.target)] }}
      APP_URL: ${{ vars[format('{0}_APP_URL', inputs.target)] }}
    steps:
      - name: Check the target is set up
        run: |
          case "$TARGET" in STAGING|PRODUCTION) ;; *) echo "::error::Unknown target $TARGET"; exit 1 ;; esac
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD \
            VERCEL_PROJECT_ID APP_URL; do
            if [ -z "${!name}" ]; then echo "::error::${TARGET}_$name is not set"; exit 1; fi
          done
          for name in VERCEL_TOKEN VERCEL_ORG_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; exit 1; fi
          done

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Migrations go first: they must keep the running app working
      # (docs/RUNBOOK.md). The seed never leaves local and CI databases.
      - name: Apply database migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --yes

      # The commit is built into the app (/api/health reports it), so the smoke
      # tests can tell the new deployment is the one answering.
      - name: Build and deploy on Vercel
        id: vercel
        # A backstop for a pull, build or upload that hangs; they take about 2 minutes (P10-18).
        timeout-minutes: 12
        env:
          # Vercel can't hand its Secret values to a build outside Vercel (it pulls
          # placeholders), so the build-only Sentry token comes from GitHub.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          export NEXT_PUBLIC_BUILD_SHA="$(git rev-parse HEAD)"
          # Skew Protection's ID: one per build, since two builds of one commit have
          # different server-action IDs; Vercel allows 32 characters (P10-11).
          export DEPLOYMENT_ID="${NEXT_PUBLIC_BUILD_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # pnpm refuses unapproved install scripts; the CLI bundles functions with esbuild.
          vercel() { pnpm dlx --allow-build=esbuild vercel@60.1.3 "$@" --token="$VERCEL_TOKEN"; }
          vercel pull --yes --environment=production
          vercel build --prod
          # The CLI's own wait never ends on a deployment Vercel blocks, so it returns once
          # the deployment is made and the next step waits (P10-18). The CLI's stdout ends
          # with the deployment's URL (https://<name>.vercel.app, no newline) after pnpm's
          # lines, which may end in other URLs: a last line ending in anything else means no
          # deployment was made. When Vercel refuses at once the CLI fails after printing
          # the URL, and the wait still says why.
          stdout="$RUNNER_TEMP/vercel-deploy.txt"
          code=0
          vercel deploy --prebuilt --prod --no-wait > "$stdout" || code=$?
          url="$(tail -n 1 "$stdout" | grep -Eo 'https://[a-z0-9.-]+\.vercel\.app$' | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::vercel deploy printed no deployment URL (exit code $code)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Fails within a poll when Vercel blocks, cancels or fails the deployment, printing
      # its reason; otherwise ends once the domain points at the deployment, or gives up
      # after 10 minutes with its last state (P10-18). Its own backstop: a step each, so
      # a slow build can't cut the wait short.
      - name: Wait for the deployment to go live
        timeout-minutes: 12
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.url }}
          DEPLOY_EXIT_CODE: ${{ steps.vercel.outputs.code }}
        run: |
          pnpm vercel:wait "$DEPLOYMENT_URL"
          # Live is not enough: a CLI that failed still fails the deploy.
          if [ "$DEPLOY_EXIT_CODE" != 0 ]; then
            echo "::error::vercel deploy exited with code $DEPLOY_EXIT_CODE"
            exit 1
          fi

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke-test the live site
        run: EXPECTED_VERSION="$(git rev-parse HEAD)" pnpm smoke
        env:
          CI: true
          SMOKE_URL: ${{ env.APP_URL }}
