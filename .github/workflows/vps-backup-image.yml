name: VPS backup image

# The backup job's image (deploy/vps/backup, docs/DECISIONS.md VPS-40) is built here and never on the
# server. A push to main that touches deploy/vps/backup, or a manual run, pushes backup-<commit> to
# ghcr.io/nanu1605/menumesh and prints tag@digest in the job summary. The admin installs it with
# `sudo app-deploy menumesh backup <tag>@<digest>`. Off until the repository variable VPS_IMAGES is
# "true": a push with it unset skips the job and bills nothing.

on:
  push:
    branches: [main]
    paths: ['deploy/vps/backup/**']
  workflow_dispatch:

concurrency:
  group: vps-backup-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the backup image
    # Only main builds, so a manual run from another branch pushes nothing.
    if: vars.VPS_IMAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        id: names
        run: |
          # The server's deploy script accepts exactly backup-<40 hex>.
          tag="backup-$GITHUB_SHA"
          [[ "$tag" =~ ^backup-[0-9a-f]{40}$ ]] || { echo "::error::Unexpected tag: $tag"; exit 1; }
          { echo "tag=$tag"; echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/menumesh:$tag"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/vps/backup
          push: true
          tags: ${{ steps.names.outputs.image }}
          # The server refuses a digest whose label isn't the tag it is deployed under.
          labels: org.opencontainers.image.version=${{ steps.names.outputs.tag }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Print the reference to install
        env:
          TAG: ${{ steps.names.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::No usable digest: $DIGEST"; exit 1; }
          {
            echo '### Backup image'
            echo
            echo 'Install it with the admin form: sudo app-deploy menumesh backup <reference>'
            echo
            echo '```'
            echo "$TAG@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
