name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a pull request's run, but never a run on main: it may be
# deploying staging.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    # Pinned in every workflow: ubuntu-latest moves to Ubuntu 26 from 19 October 2026, and
    # Playwright's system packages and the Supabase CLI should move with a tested change.
    runs-on: ubuntu-24.04
    # A run took 25 minutes by October 2026, 19.5 of them end-to-end on one worker:
    # room to grow, and a hung run still stops.
    timeout-minutes: 45
    env:
      CI: true
      E2E_PORT: 3100
    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known high or critical advisories in what ships fail the build (spec §19 Phase 9).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Uses the Supabase CLI pinned in devDependencies, same as local development.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Write .env.local from local Supabase
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:${E2E_PORT}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY}"
            # Throwaway per run: only signs cookies for this CI app instance.
            echo "CUSTOMER_COOKIE_SECRET=$(openssl rand -base64 48)"
          } > .env.local

      - name: Check generated DB types are current
        run: |
          pnpm db:types
          git diff --exit-code -- src/types/database.ts

      - name: Database tests
        run: pnpm db:test

      - name: Build
        run: pnpm build

      # First-load JavaScript per page against its area's ceiling (docs/DECISIONS.md W-14).
      - name: Check the JavaScript budget
        run: pnpm budget

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      # Page snapshots of the first few failures, readable straight from the log.
      - name: Show end-to-end failure snapshots
        if: failure()
        run: |
          for f in $(find test-results -name error-context.md -not -path '*retry*' 2>/dev/null | head -n 3); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Show auth service logs
        if: failure()
        run: docker logs supabase_auth_tableorder 2>&1 | tail -n 60

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Staging follows main once the tests pass (docs/DECISIONS.md P10-1). Off until
  # the repository variable DEPLOY_STAGING is "true" (the accounts exist), and again once
  # VPS_DEPLOY_STAGING is "true": staging then runs on the shared server (the two jobs below).
  staging:
    name: Deploy staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true' && vars.VPS_DEPLOY_STAGING != 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      target: STAGING
    secrets: inherit

  # The shared server's staging (docs/DECISIONS.md VPS-23, VPS-41). Both jobs are skipped, and bill
  # nothing, until the repository variables are "true": VPS_IMAGES builds and pushes the images,
  # VPS_DEPLOY_STAGING also deploys and smoke-tests them (and takes over from the Vercel job above).
  vps-build:
    name: Build the VPS images
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_IMAGES == 'true'
    # A called workflow cannot raise its caller's permissions.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/vps-build.yml
    with:
      target: STAGING
    secrets: inherit

  vps-staging:
    name: Deploy staging on the VPS
    needs: vps-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_IMAGES == 'true' && vars.VPS_DEPLOY_STAGING == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/vps-deploy-staging.yml
    with:
      web: ${{ needs.vps-build.outputs.web }}
      migrate: ${{ needs.vps-build.outputs.migrate }}
    secrets: inherit
